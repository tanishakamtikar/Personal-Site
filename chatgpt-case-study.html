<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Case Study - Tanisha Kamtikar</title>
    <link rel="icon" type="image" href="weblogo.png">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #DCA1A1;
            color: #444;
        }

        h1 {
            font-size: 120%;
        }

        p {
            font-size: 80%;
        }

        .wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .back-link {
            align-self: flex-start;
            margin-left: 40px;
            margin-bottom: 30px;
            text-decoration: none;
            color: #444;
            font-size: 1rem;
        }

        .back-link:hover {
            color: #000;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            max-width: 700px;
            width: 100%;
            margin-bottom: 30px;
            text-align: center;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .link-box {
            display: block;
            background: #DCA1A1;
            color: #444;
            text-decoration: none;
            padding: 18px 25px;
            border-radius: 12px;
            font-size: 1rem;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .link-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.12);
            color: #000;
        }

        .link-box i {
            margin-right: 10px;
        }
    </style>
</head>
<body>

<div class="wrapper">

    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

    <div class="card">
        <h1>ChatGPT Case Study</h1>
        <p>Here are the links related to this project:</p>

        <div class="links">
            <a href="https://drive.google.com/file/d/14ANh-juUJQoKFvdsmzVro1tIEUGOHFlo/view?usp=sharing" target="_blank" class="link-box">
                <i class="fa-solid fa-link"></i> Link 1 - Full Case Study (Long Version)
            </a>
            <a href="https://drive.google.com/file/d/1QIyw3VR34gUE-wWItRt14mJsKQcTLQCs/view?usp=sharing" target="_blank" class="link-box">
                <i class="fa-solid fa-link"></i> Link 2 - Case Study PPT (Short Version)
            </a>
        </div>
    </div>

</div>

</body>
</html>
